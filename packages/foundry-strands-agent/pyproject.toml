[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-strands-agent"
version = "1.0.0"
license = "Apache-2.0"
license-files = ["LICENSE*", "NOTICE*"]
description = "Foundry Strands Agent — Strands SDK adapter, StrandsAgentFactory, StrandsAgentConfig, security"
authors = [{ name = "Booz Allen Hamilton" }]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "foundry-agent-core>=1.0.0",
    "foundry-agent-config>=1.0.0",
    "strands-agents[a2a,openai]>=1.45.0",
    "strands-agents-tools[a2a-client]>=0.1.0",
    "openai",
    "pydantic>=2.0",
    "botocore>=1.35.0",
    "mcp>=1.0.0",
    "cryptography>=43.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_strands_agent"]

# Pytest + coverage config is package-local so each package owns its own
# coverage source path and threshold. See docs/foundry/internal/coverage.md.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib --cov=src/foundry_strands_agent --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/foundry_strands_agent"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
